<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Danh sách sản phẩm</title>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
    th {
      background: #f2f2f2;
    }
  </style>
</head>
<body>
  <h1>Danh sách sản phẩm</h1>

  <button onclick="loadProducts()">Tải lại</button>
  <div id="output">Đang chờ...</div>

  <script>
    async function loadProducts() {
      document.getElementById("output").textContent = "Đang tải...";

      try {
        const response = await fetch("http://localhost:8080/apis/graphql", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            query: `
              query {
                getAllProducts {
                  id
                  title
                  price
                  quantity
                  desc
                  category {
                    id
                    name
                  }
                }
              }
            `
          })
        });

        const result = await response.json();
        console.log(result);

        if (result.errors) {
          document.getElementById("output").textContent = "Lỗi GraphQL: " + JSON.stringify(result.errors);
          return;
        }

        const products = result.data.getAllProducts;
        if (!products || products.length === 0) {
          document.getElementById("output").textContent = "Không có sản phẩm nào.";
          return;
        }

        let html = "<table><tr><th>ID</th><th>Title</th><th>Price</th><th>Quantity</th><th>Description</th><th>Category</th></tr>";
        for (const p of products) {
          html += `
            <tr>
              <td>${p.id}</td>
              <td>${p.title || ""}</td>
              <td>${p.price ?? ""}</td>
              <td>${p.quantity ?? ""}</td>
              <td>${p.desc || ""}</td>
              <td>${p.category ? p.category.name : "Chưa có"}</td>
            </tr>
          `;
        }
        html += "</table>";

        document.getElementById("output").innerHTML = html;
      } catch (err) {
        document.getElementById("output").textContent = "Lỗi fetch: " + err;
      }
    }

    // Auto load khi mở trang
    loadProducts();
  </script>
</body>
</html>
