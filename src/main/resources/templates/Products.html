<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Danh sách sản phẩm</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
    th {
      background: #f2f2f2;
    }
  </style>
</head>
<body>
  <h1>Danh sách sản phẩm (giá tăng dần)</h1>

  <button onclick="loadProducts()">Tải lại</button>
  <div id="output">Đang chờ...</div>

  <script>
    function loadProducts() {
      $("#output").text("Đang tải...");

      $.ajax({
        url: "http://localhost:8080/apis/graphql",
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify({
          query: `
            query {
              getAllProductsSortedByPrice {
                id
                title
                price
                quantity
                desc
                category {
                  id
                  name
                }
              }
            }
          `
        }),
        success: function(result) {
          if (result.errors) {
            $("#output").text("Lỗi GraphQL: " + JSON.stringify(result.errors));
            return;
          }

          const products = result.data.getAllProductsSortedByPrice;
          if (!products || products.length === 0) {
            $("#output").text("Không có sản phẩm nào.");
            return;
          }

          let html = "<table><tr><th>ID</th><th>Title</th><th>Price</th><th>Quantity</th><th>Description</th></tr>";
          products.forEach(p => {
            html += `
              <tr>
                <td>${p.id}</td>
                <td>${p.title || ""}</td>
                <td>${p.price ?? ""}</td>
                <td>${p.quantity ?? ""}</td>
                <td>${p.desc || ""}</td>
              </tr>
            `;
          });
          html += "</table>";

          $("#output").html(html);
        },
        error: function(err) {
          $("#output").text("Lỗi AJAX: " + JSON.stringify(err));
        }
      });
    }

    // Auto load khi mở trang
    $(document).ready(loadProducts);
  </script>
</body>
</html>
