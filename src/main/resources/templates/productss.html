<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quản lý Product</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<style>
table { border-collapse: collapse; width: 100%; margin-top: 10px; }
th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
th { background: #f2f2f2; }
input { margin: 4px; }
</style>
</head>
<body>
<h1>Quản lý Product</h1>

<h3>Tạo / Cập nhật Product</h3>
<form id="productForm">
<input type="hidden" id="productId">
<input type="text" id="title" placeholder="Title" required>
<input type="number" id="quantity" placeholder="Quantity">
<input type="text" id="desc" placeholder="Description">
<input type="number" id="price" placeholder="Price" step="0.01">
<input type="number" id="categoryId" placeholder="Category ID" required>
<button type="submit">Lưu</button>
<button type="button" onclick="resetForm()">Hủy</button>
</form>

<button onclick="loadProducts()">Tải lại</button>
<div id="output"></div>

<script>
function resetForm(){
  $("#productForm")[0].reset();
  $("#productId").val("");
}

function loadProducts(){
  $("#output").text("Đang tải...");
  $.ajax({
    url:"http://localhost:8080/apis/graphql",
    method:"POST",
    contentType:"application/json",
    data: JSON.stringify({query:`query{getAllProducts{id title quantity desc price category{id name}}}`}),
    success:function(res){
      if(res.errors){ $("#output").text("Lỗi: "+JSON.stringify(res.errors)); return; }
      const products=res.data.getAllProducts;
      if(!products || products.length===0){ $("#output").text("Chưa có Product"); return; }
      let html="<table><tr><th>ID</th><th>Title</th><th>Quantity</th><th>Description</th><th>Price</th><th>Category</th><th>Action</th></tr>";
      products.forEach(p=>{
        html+=`<tr>
          <td>${p.id}</td>
          <td>${p.title}</td>
          <td>${p.quantity||""}</td>
          <td>${p.desc||""}</td>
          <td>${p.price||""}</td>
          <td>${p.category?p.category.id:""}</td>
          <td>
            <button onclick="editProduct(${p.id},'${p.title}',${p.quantity||0},'${p.desc||""}',${p.price||0},${p.category? p.category.id : ''})">Sửa</button>
            <button onclick="deleteProduct(${p.id})">Xóa</button>
          </td>
        </tr>`;
      });
      html+="</table>";
      $("#output").html(html);
    }
  });
}

function editProduct(id,title,quantity,desc,price,categoryId){
  $("#productId").val(id);
  $("#title").val(title);
  $("#quantity").val(quantity);
  $("#desc").val(desc);
  $("#price").val(price);
  $("#categoryId").val(categoryId);
}

function deleteProduct(id){
  if(!confirm("Xóa Product?")) return;
  $.ajax({
    url:"http://localhost:8080/apis/graphql",
    method:"POST",
    contentType:"application/json",
    data: JSON.stringify({query:`mutation($id:ID!){deleteProduct(id:$id)}`,variables:{id}}),
    success:function(){ loadProducts(); }
  });
}

$("#productForm").submit(function(e){
  e.preventDefault();
  const id=$("#productId").val();
  const title=$("#title").val();
  const quantity=parseInt($("#quantity").val())||0;
  const desc=$("#desc").val();
  const price=parseFloat($("#price").val())||0;
  const categoryId=parseInt($("#categoryId").val());

  const query=id ?
    `mutation($id:ID!, $product:ProductInput!){updateProduct(id:$id, product:$product){id title}}` :
    `mutation($product:ProductInput!){createProduct(product:$product){id title}}`;

  const variables=id ? {id, product:{title,quantity,desc,price,categoryId}} : {product:{title,quantity,desc,price,categoryId}};

  $.ajax({url:"http://localhost:8080/apis/graphql",method:"POST",contentType:"application/json",data:JSON.stringify({query,variables}),success:function(){resetForm();loadProducts();}});
});

$(document).ready(loadProducts);
</script>
</body>
</html>
